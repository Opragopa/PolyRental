name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run tests in the isolated PostgreSQL service
        run: docker compose --profile test run --rm --build test

  browser:
    name: Calendar and mobile UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tools/browser-qa
      - run: tools/browser-qa/node_modules/.bin/playwright install --with-deps chromium
      - run: node --test tests/calendar.test.cjs
      - run: node tests/calendar-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules

  deploy:
    name: Deploy production
    needs: [test, browser]
    # Production credentials are repository secrets. A successful push to main
    # is the deliberate deployment trigger.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, PolyRental]
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Update and restart the production services locally
        shell: powershell
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          if (-not $env:DEPLOY_PATH) { throw 'GitHub Actions secret DEPLOY_PATH is not configured' }
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\deploy.ps1') -ExpectedCommit $env:EXPECTED_COMMIT -ProjectRoot $env:DEPLOY_PATH
