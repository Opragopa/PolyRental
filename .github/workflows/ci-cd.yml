name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests in the isolated PostgreSQL service
        run: docker compose --profile test run --rm --build test

  deploy:
    name: Deploy production
    needs: test
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, Windows, PolyRental]
    environment: production
    steps:
      - name: Update and restart the production services locally
        shell: pwsh
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          if (-not $env:DEPLOY_PATH) { throw 'GitHub Actions variable DEPLOY_PATH is not configured' }
          & (Join-Path $env:DEPLOY_PATH 'scripts\deploy.ps1') -ExpectedCommit $env:EXPECTED_COMMIT
