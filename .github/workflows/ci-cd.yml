name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Create non-production Compose defaults
        run: cp .env.example .env
      - name: Run tests in the isolated PostgreSQL service
        run: docker compose --profile test run --rm --build test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify an encrypted backup by restoring an isolated test database
        run: |
          python -m pip install cryptography==46.0.3
          python scripts/verify_test_restore.py --seed-synthetic --fresh-migrations

  browser:
    name: Mobile UI (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    container:
      # Keep this version aligned with tools/browser-qa/package-lock.json.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --prefix tools/browser-qa
      - run: node --test tests/calendar.test.cjs
      - run: node tests/calendar-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/design-flow-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/identity-consent-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/support-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/cart-flow-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/cart-optimistic-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/soft-delete-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/profile-onboarding-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/request-review-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/design-mobile-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/receipt-preview-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/completion-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/equipment-picker-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/site-auth-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/loading-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/staff-drafts-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/client-catalog-pages-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/catalog-pages-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/history-support-pages-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/admin-queue-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      - run: node tests/support-deeplink-ui.cjs
        env:
          NODE_PATH: ./tools/browser-qa/node_modules
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}

  documents:
    name: Local document robustness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t polyrental-document-qa .
      - run: mkdir -p artifacts
      - name: Synthetic classification benchmark (no personal data)
        run: docker run --rm -v "$PWD/artifacts:/artifacts" polyrental-document-qa python scripts/benchmark_documents.py --output /artifacts/document-benchmark.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-document-benchmark
          path: artifacts/document-benchmark.json

  deploy:
    name: Deploy production
    needs: [test, browser, documents]
    # Production credentials are repository secrets. A successful push to main
    # is the deliberate deployment trigger.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && !contains(github.event.head_commit.message, '[deploy-without-waiting]')
    runs-on: [self-hosted, Windows, PolyRental]
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Update and restart the production services locally
        shell: powershell
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          if (-not $env:DEPLOY_PATH) { throw 'GitHub Actions secret DEPLOY_PATH is not configured' }
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\deploy.ps1') -ExpectedCommit $env:EXPECTED_COMMIT -ProjectRoot $env:DEPLOY_PATH

  deploy_requested_release:
    name: Deploy requested release without waiting for CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && contains(github.event.head_commit.message, '[deploy-without-waiting]')
    runs-on: [self-hosted, Windows, PolyRental]
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Update and restart production
        shell: powershell
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          if (-not $env:DEPLOY_PATH) { throw 'GitHub Actions secret DEPLOY_PATH is not configured' }
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\deploy.ps1') -ExpectedCommit $env:EXPECTED_COMMIT -ProjectRoot $env:DEPLOY_PATH
