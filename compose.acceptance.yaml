# Always start via scripts/start-acceptance.ps1. This project has its own DB.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: polyrental_acceptance
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: local-acceptance-only
    volumes:
      - acceptance_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acceptance -d polyrental_acceptance"]
      interval: 3s
      retries: 20
  miniapp:
    build: .
    env_file: .env.acceptance
    environment:
      DATABASE_URL: postgresql+psycopg://acceptance:local-acceptance-only@db:5432/polyrental_acceptance
    command: sh -c "alembic upgrade head && uvicorn app.miniapp_server:app --host 0.0.0.0 --port 8000 --no-access-log"
    ports:
      - "127.0.0.1:18080:8000"
    depends_on:
      db:
        condition: service_healthy
  bot:
    build: .
    env_file: .env.acceptance
    environment:
      DATABASE_URL: postgresql+psycopg://acceptance:local-acceptance-only@db:5432/polyrental_acceptance
    command: python -m app.bot
    depends_on:
      db:
        condition: service_healthy
      miniapp:
        condition: service_started
volumes:
  acceptance_db:
