<!doctype html>
<html lang="ru" data-theme="light" data-festive="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новогодняя шапка PolyRental 0.6.0</title>
  <style>
    @font-face {
      font-family: Onest;
      src: url("../../app/miniapp_static/onest-cyrillic-400-normal.woff2") format("woff2");
      font-display: swap;
      unicode-range: U+0400-045F;
    }
    @font-face {
      font-family: Onest;
      src: url("../../app/miniapp_static/onest-latin-400-normal.woff2") format("woff2");
      font-display: swap;
      unicode-range: U+0000-00FF,U+2000-206F;
    }
    @font-face {
      font-family: Onest;
      src: url("../../app/miniapp_static/onest-cyrillic-700-normal.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
      unicode-range: U+0400-045F;
    }
    @font-face {
      font-family: Onest;
      src: url("../../app/miniapp_static/onest-latin-700-normal.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
      unicode-range: U+0000-00FF,U+2000-206F;
    }
    :root {
      color-scheme: light;
      font-family: Onest, "Segoe UI", sans-serif;
      --board: #e8eef7;
      --canvas: #f3f6fb;
      --surface: #fff;
      --ink: #17243d;
      --muted: #46566e;
      --border: #c8d3e3;
      --control: #6c7f99;
      --accent: #294bbf;
      --selection: #e6edfe;
      --wire: #536d6a;
      --holiday-top: #f7faf9;
      --phone-rim: #25344c;
      --shadow: #17243d21;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --board: #111a2a;
      --canvas: #17212b;
      --surface: #232e3c;
      --ink: #f3f6fc;
      --muted: #bdcadd;
      --border: #44566d;
      --control: #8a9db7;
      --accent: #abc0ff;
      --selection: #293e66;
      --wire: #9ab8ad;
      --holiday-top: #203331;
      --phone-rim: #475a76;
      --shadow: #040a145d;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--board); color: var(--ink); line-height: 1.5; }
    button, select { font: inherit; color: inherit; }
    select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    h1, h2, h3, p { margin: 0; }
    .board { width: min(100%, 1320px); margin: 0 auto; padding: clamp(20px, 4vw, 62px) clamp(12px, 4vw, 52px) 36px; }
    .intro { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 24px; }
    h1 { font-size: clamp(28px, 4vw, 48px); letter-spacing: -.045em; line-height: 1.12; }
    .intro p { margin-top: 7px; color: var(--muted); font-size: 14px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; }
    .controls label { display: grid; gap: 4px; font-size: 13px; font-weight: 700; }
    .controls select { min-height: 44px; min-width: 0; border: 1px solid var(--control); border-radius: 9px; background: var(--surface); padding: 6px 11px; }
    .previews { display: grid; grid-template-columns: minmax(0, 1fr) minmax(270px, 320px); gap: clamp(16px, 3vw, 34px); align-items: start; }
    figure { margin: 0; min-width: 0; }
    figcaption { margin: 0 0 8px 4px; color: var(--muted); font-size: 13px; font-weight: 700; }
    .screen { position: relative; isolation: isolate; background: var(--canvas); box-shadow: 0 13px 34px var(--shadow); }
    .web { overflow: hidden; min-height: 459px; border: 1px solid var(--border); border-radius: 16px; display: grid; grid-template-columns: 150px minmax(0, 1fr); }
    .rail { border-right: 1px solid var(--border); padding: 25px 10px; }
    .rail span, .phone-nav span { display: block; padding: 9px 12px; border-radius: 8px; font-size: 13px; }
    .rail span + span { margin-top: 3px; }
    [aria-current] { background: var(--selection); color: var(--accent); font-weight: 700; }
    .web-main, .phone-main { min-width: 0; }
    .preview-header { position: relative; }
    .garland {
      position: absolute;
      z-index: 2;
      inset: 0 0 auto;
      container-type: inline-size;
      height: 39px;
      overflow: visible;
      pointer-events: none;
      background: linear-gradient(var(--holiday-top), transparent);
    }
    :root[data-festive="false"] .garland { display: none; }
    :root[data-festive="true"] .web .header-row { padding-top: 34px; min-height: 82px; }
    :root[data-festive="true"] .rail { padding-top: 49px; }
    :root[data-festive="true"] .phone .telegram-bar { padding-top: 40px; min-height: 72px; }
    .strand { position: absolute; top: 5px; width: 50%; height: 33px; }
    .strand:nth-child(2) { left: 50%; }
    .strand::before {
      content: "";
      position: absolute;
      inset: -13px -1px auto;
      height: 29px;
      border-bottom: 1.5px solid var(--wire);
      border-radius: 0 0 50% 50% / 0 0 58% 58%;
    }
    .lamp {
      position: absolute;
      left: var(--x);
      top: var(--y);
      display: block;
      width: 8px;
      height: 12px;
      margin-left: -4px;
      transform: rotate(var(--angle, 0deg));
      transform-origin: center -2px;
      border: 1px solid var(--shade);
      border-radius: 54% 54% 48% 48% / 60% 60% 39% 39%;
      background: radial-gradient(ellipse at 32% 24%, #fff9 0 13%, transparent 47%), var(--lamp);
      box-shadow: 0 0 9px 2px var(--glow);
    }
    .lamp::before {
      content: "";
      position: absolute;
      top: -4px;
      left: 1px;
      width: 4px;
      height: 4px;
      border-radius: 1px;
      background: var(--wire);
    }
    .lamp:nth-child(4n + 1) { --lamp: #ffd479; --shade: #ab6d2d; --glow: #ffc36470; }
    .lamp:nth-child(4n + 2) { --lamp: #79dcc0; --shade: #3e9b88; --glow: #6ce0be6b; }
    .lamp:nth-child(4n + 3) { --lamp: #f89388; --shade: #b85856; --glow: #f7817866; }
    .lamp:nth-child(4n) { --lamp: #a8c8fb; --shade: #618cc5; --glow: #8fbdfc76; }
    :root[data-theme="dark"] .lamp { border-color: var(--lamp); box-shadow: 0 0 10px 3px var(--glow); }
    .header-row { display: flex; align-items: center; gap: 12px; min-height: 48px; margin-inline: 20px; border-bottom: 1px solid var(--border); }
    .brand { font-size: 17px; font-weight: 700; }
    .version { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .logout { border: 1px solid var(--control); padding: 4px 9px; border-radius: 8px; font-size: 12px; }
    .workspace { padding: 24px 20px; }
    .workspace h2 { font-size: clamp(21px, 2.8vw, 31px); letter-spacing: -.025em; }
    .workspace p { margin: 5px 0 18px; color: var(--muted); font-size: 14px; }
    .categories { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .category { display: flex; align-items: center; gap: 9px; padding: 10px; min-width: 0; min-height: 52px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); font-size: 13px; font-weight: 700; }
    .category-icon {
      flex: 0 0 17px;
      height: 17px;
      border: 1.5px solid var(--accent);
      border-radius: 4px;
      display: grid;
      place-items: center;
    }
    .category-icon::before { content: ""; width: 7px; height: 7px; border: 1.5px solid var(--accent); border-radius: 50%; }
    .category:nth-child(2n) .category-icon { border-radius: 50%; }
    .category:nth-child(n + 3) .category-icon::before { border-radius: 1px; transform: rotate(45deg); }
    .phone { border: 5px solid var(--phone-rim); border-radius: 27px; overflow: hidden; min-height: 459px; display: flex; flex-direction: column; }
    .telegram-bar { display: flex; align-items: center; gap: 8px; justify-content: space-between; min-height: 45px; border-bottom: 1px solid var(--border); padding: 6px 12px; background: var(--surface); }
    .telegram-bar strong { font-size: 13px; }
    .telegram-bar span { font-size: 13px; color: var(--muted); }
    .phone .header-row { min-height: 28px; justify-content: center; border: 0; }
    .phone .version { margin: 0; }
    .phone .workspace { padding: 13px 13px 17px; }
    .phone .workspace h2 { font-size: 22px; line-height: 1.2; }
    .phone .workspace p { font-size: 13px; }
    .phone-nav { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 8px; background: var(--surface); border-top: 1px solid var(--border); text-align: center; }
    .footnote { margin-top: 18px; color: var(--muted); font-size: 13px; }
    @container (max-width: 430px) {
      .lamp:nth-child(even) { display: none; }
      .lamp:nth-child(4n + 3) { --lamp: #a8c8fb; --shade: #618cc5; --glow: #8fbdfc76; }
      .strand:nth-child(2) .lamp:nth-child(4n + 1) { --lamp: #79dcc0; --shade: #3e9b88; --glow: #6ce0be6b; }
      .strand:nth-child(2) .lamp:nth-child(4n + 3) { --lamp: #f89388; --shade: #b85856; --glow: #f7817866; }
    }
    @media (max-width: 840px) {
      .previews { grid-template-columns: minmax(0, 1fr); }
      figure:has(.phone) { width: min(100%, 390px); }
      .web { min-height: 345px; }
      .phone { min-height: 400px; }
    }
    @media (max-width: 570px) {
      .web { grid-template-columns: minmax(0, 1fr); }
      .rail { display: none; }
      .header-row { margin-inline: 12px; gap: 8px; }
      .web .workspace { padding-inline: 12px; }
      .controls select { max-width: 100%; }
    }
  </style>
</head>
<body>
  <main class="board">
    <header class="intro">
      <div>
        <h1>Новогодняя шапка</h1>
        <p>Макет PolyRental 0.6.0</p>
      </div>
      <div class="controls">
        <label>Дата для просмотра
          <select id="date">
            <option value="2026-11-30">30 ноября</option>
            <option value="2026-12-01" selected>1 декабря</option>
            <option value="2027-01-08">8 января</option>
            <option value="2027-01-09">9 января</option>
          </select>
        </label>
        <label>Тема
          <select id="theme">
            <option value="light">Светлая</option>
            <option value="dark">Тёмная</option>
          </select>
        </label>
      </div>
    </header>

    <div class="previews">
      <figure>
        <figcaption>Сайт</figcaption>
        <div class="screen web">
          <div class="garland" aria-hidden="true"></div>
          <div class="rail" aria-label="Разделы">
            <span aria-current="page">Бронирование</span>
            <span>Профиль</span>
          </div>
          <div class="web-main">
            <header class="preview-header">
              <div class="header-row">
                <strong class="brand">ПолиРентал</strong><span class="version">v0.6.0</span><span class="logout">Выйти</span>
              </div>
            </header>
            <section class="workspace">
              <h2>Каталог оборудования</h2>
              <p>Выберите технику для бронирования.</p>
              <div class="categories"></div>
            </section>
          </div>
        </div>
      </figure>
      <figure>
        <figcaption>Telegram Mini App</figcaption>
        <div class="screen phone">
          <div class="garland" aria-hidden="true"></div>
          <div class="telegram-bar"><span>Закрыть</span><strong>ПолиРентал</strong><span aria-hidden="true">···</span></div>
          <header class="preview-header">
            <div class="header-row"><span class="version">v0.6.0</span></div>
          </header>
          <section class="workspace phone-main">
            <h2>Каталог оборудования</h2>
            <p>Выберите технику для бронирования.</p>
            <div class="categories"></div>
          </section>
          <div class="phone-nav" aria-label="Разделы"><span aria-current="page">Бронирование</span><span>Профиль</span></div>
        </div>
      </figure>
    </div>
    <p class="footnote">Предлагаемый период оформления — с 1 декабря по 8 января включительно, по Москве.</p>
  </main>
  <template id="categories">
    <div class="category"><span class="category-icon" aria-hidden="true"></span>Камеры</div>
    <div class="category"><span class="category-icon" aria-hidden="true"></span>Оптика</div>
    <div class="category"><span class="category-icon" aria-hidden="true"></span>Свет</div>
    <div class="category"><span class="category-icon" aria-hidden="true"></span>Звук</div>
  </template>
  <script>
    for (const grid of document.querySelectorAll(".categories")) {
      grid.append(document.getElementById("categories").content.cloneNode(true));
    }
    const lampPositions = [
      [9, 10, -14], [21, 14, -11], [33, 17, -7], [45, 19, -2],
      [57, 19, 2], [69, 17, 7], [81, 14, 11], [93, 9, 14],
    ];
    for (const garland of document.querySelectorAll(".garland")) {
      for (let span = 0; span < 2; span++) {
        const strand = document.createElement("span");
        strand.className = "strand";
        for (const [x, y, angle] of lampPositions) {
          const lamp = document.createElement("i");
          lamp.className = "lamp";
          lamp.style.cssText = `--x:${x}%;--y:${y}px;--angle:${angle}deg`;
          strand.append(lamp);
        }
        garland.append(strand);
      }
    }
    document.getElementById("date").addEventListener("change", event => {
      const value = event.target.value;
      document.documentElement.dataset.festive = String(value >= "2026-12-01" && value <= "2027-01-08");
    });
    document.getElementById("theme").addEventListener("change", event => {
      document.documentElement.dataset.theme = event.target.value;
    });
  </script>
</body>
</html>
