# Запуск только бота, базы и клиентского Mini App: docker compose -f compose.yaml -f compose.miniapp.yaml up -d --build
services:
  web:
    profiles: [admin]
  bot:
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
  db_test:
    profiles: [test]
  test:
    profiles: [test]
  miniapp:
    build: .
    command: uvicorn app.miniapp_server:app --host 0.0.0.0 --port 8000 --no-access-log
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://polyrental:${POSTGRES_PASSWORD:-polyrental}@db:5432/polyrental
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
