services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: polyrental
      POSTGRES_USER: polyrental
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polyrental}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyrental"]
      interval: 3s
      retries: 20
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://polyrental:${POSTGRES_PASSWORD:-polyrental}@db:5432/polyrental
    ports:
      - "8000:8000"
    volumes:
      - templates:/app/templates
    depends_on:
      db:
        condition: service_healthy
  bot:
    build: .
    command: python -m app.bot
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://polyrental:${POSTGRES_PASSWORD:-polyrental}@db:5432/polyrental
    depends_on:
      db:
        condition: service_healthy
  db_test:
    image: postgres:16
    environment:
      POSTGRES_DB: polyrental_test
      POSTGRES_USER: polyrental
      POSTGRES_PASSWORD: polyrental_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyrental -d polyrental_test"]
      interval: 3s
      retries: 20
  test:
    build: .
    command: sh -c "alembic upgrade head && pytest -q"
    environment:
      DATABASE_URL: postgresql+psycopg://polyrental:polyrental_test@db_test:5432/polyrental_test
      ADMIN_IDS: '100'
    depends_on:
      db_test:
        condition: service_healthy
volumes:
  pgdata:
  templates:
