server {
    listen 80;
    server_name testing.cloudopragopa.online;
    location ^~ /.well-known/acme-challenge/ {
        root C:/nginx-1.31.8/html;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name testing.cloudopragopa.online;
    ssl_certificate C:/certs/polyrental-acceptance/testing.cloudopragopa.online-chain.pem;
    ssl_certificate_key C:/certs/polyrental-acceptance/testing.cloudopragopa.online-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' https: data: blob:; connect-src 'self'; object-src 'none'; frame-src https://oauth.telegram.org https://telegram.org; base-uri 'none'; frame-ancestors 'self' https://web.telegram.org" always;
    client_max_body_size 64k;
    location = /site/auth {
        access_log off;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/(calendar\.ics|calendar/|api/miniapp/document-download/) {
        access_log off;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/api/miniapp/(bookings/[0-9]+/identity|admin/bookings/[0-9]+/(identity|documents)) {
        client_max_body_size 40m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
