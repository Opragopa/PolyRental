server {
    listen 80;
    server_name polyrental.cloudopragopa.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name polyrental.cloudopragopa.online;

    ssl_certificate /etc/letsencrypt/live/polyrental.cloudopragopa.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polyrental.cloudopragopa.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' https: data: blob:; connect-src 'self'; object-src 'none'; frame-src https://oauth.telegram.org https://telegram.org; base-uri 'none'; frame-ancestors 'self' https://web.telegram.org" always;
    client_max_body_size 64k;

    # Telegram login responses contain signed identity data; keep them out of access logs.
    location = /site/auth {
        access_log off;
        proxy_pass http://miniapp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The calendar subscription URL contains a bearer token; never write it to proxy access logs.
    location = /calendar.ics {
        access_log off;
        add_header Cache-Control "no-store, max-age=0" always;
        proxy_pass http://miniapp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Legacy token-in-path feed URLs are also bearer credentials.
    location ^~ /calendar/ {
        access_log off;
        add_header Cache-Control "no-store, max-age=0" always;
        proxy_pass http://miniapp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Download URLs are short-lived bearer capabilities; keep them out of access logs.
    location ^~ /api/miniapp/document-download/ {
        access_log off;
        add_header Cache-Control "no-store, max-age=0" always;
        proxy_pass http://miniapp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # The application validates photo uploads up to 8 MiB; allow multipart overhead.
    location ~ ^/api/miniapp/admin/catalog/articles/[0-9]+/photo$ {
        client_max_body_size 9m;
        proxy_pass http://miniapp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/api/miniapp/(bookings/[0-9]+/identity|admin/bookings/[0-9]+/(identity|documents)) {
        client_max_body_size 40m;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' https: data: blob:; connect-src 'self'; object-src 'none'; frame-src https://oauth.telegram.org https://telegram.org; base-uri 'none'; frame-ancestors 'self' https://web.telegram.org" always;
        proxy_pass http://miniapp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://miniapp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
