# Начальная конфигурация: только проверка домена для Let's Encrypt.
# После выпуска сертификата scripts/enable-https.ps1 заменит её на miniapp-https.conf.
server {
    listen 80;
    server_name polyrental.cloudopragopa.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503 "HTTPS ещё не настроен\n";
    }
}
