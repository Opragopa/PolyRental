# --- Блок HTTP (порт 80) ---
server {
    listen 80;
    server_name polyrental.cloudopragopa.online;

    # ACME-проверка (должна работать по HTTP для продления сертификата)
    location ^~ /.well-known/acme-challenge/ {
        root C:/nginx-1.31.8/html;
        default_type text/plain;
        try_files $uri =404;
    }

    # Всё остальное перенаправляем на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Блок HTTPS (порт 443) ---
server {
    listen 443 ssl;
    server_name polyrental.cloudopragopa.online;

    # Пути к сертификатам, которые выпустил win-acme
    ssl_certificate     C:/certs/polyrental/polyrental.cloudopragopa.online-chain.pem;
    ssl_certificate_key C:/certs/polyrental/polyrental.cloudopragopa.online-key.pem;

    # Базовые настройки SSL
    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' https: data: blob:; connect-src 'self'; object-src 'none'; frame-src https://oauth.telegram.org https://telegram.org; base-uri 'none'; frame-ancestors 'self' https://web.telegram.org" always;
    client_max_body_size 64k;

    # Keep Telegram login responses and bearer capabilities out of access logs.
    location = /site/auth {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/(calendar\.ics|calendar/|api/miniapp/document-download/) {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Документы: до 4 x 8 МБ, без кеша и буферизации на диске nginx.
    location ~ ^/api/miniapp/(bookings/[0-9]+/identity|admin/bookings/[0-9]+/(identity|documents)) {
        client_max_body_size 40m;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' https: data: blob:; connect-src 'self'; object-src 'none'; frame-src https://oauth.telegram.org https://telegram.org; base-uri 'none'; frame-ancestors 'self' https://web.telegram.org" always;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Проксирование на Mini App (порт 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
