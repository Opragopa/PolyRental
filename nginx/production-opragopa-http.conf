# ACME bootstrap for the new domain; the existing production host stays active.
server {
    listen 80;
    server_name polyrental.opragopa.com;
    location ^~ /.well-known/acme-challenge/ {
        root C:/nginx-1.31.8/html;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 503 "HTTPS setup in progress\n";
    }
}
